[package]
name = "desktop"
version = "1.0.2"
description = "Sliptab desktop: the screen-edge notes bar"
authors = ["Adarsh Kumar Singh"]
edition = "2021"
license = "GPL-3.0-only"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
notes-core = { path = "../../core", features = ["serde", "client"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
base64 = "0.23.1"
getrandom = "0.3"
ureq = { version = "3", features = ["json"] }
tokio = { version = "1.54.1", features = ["time"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.14", default-features = false, features = ["tokio", "global_shortcuts"] }
futures-util = "0.3"
gdkx11 = "0.18"
gdkx11-sys = "0.18"
gtk = "0.18"
x11 = { version = "2.21", features = ["xlib"] }

[target.'cfg(windows)'.dependencies]
# Window region (the click-through edge), tool-window style and focus hand-back.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

