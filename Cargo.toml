[workspace]
resolver = "2"
members = ["core", "desktop/src-tauri"]

[workspace.package]
edition = "2021"
license = "GPL-3.0-only"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
