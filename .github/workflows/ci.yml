name: ci
on: [push, pull_request]

jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci && npm run check && npm test
        working-directory: desktop
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Starts the real app on a Windows desktop and checks the edge window with the Win32 API:
  # placement, click-through outside the bar, hover to open and close. Screenshots as artifact.
  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: desktop
      - run: npm run tauri build -- --debug --no-bundle
        working-directory: desktop
      - run: powershell -ExecutionPolicy Bypass -File desktop\scripts\windows-smoke.ps1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-screenshots
          path: smoke-*.png
          if-no-files-found: ignore
