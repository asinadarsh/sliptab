name: desktop-build
# Installers for every OS. Run by hand (Actions → desktop-build → Run workflow) to just build,
# or push a tag v1.2.3 to build, sign the updates and publish them: running apps update
# themselves within 6 hours. The tag must match the version in desktop/src-tauri/tauri.conf.json.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04: older glibc, so the .deb/AppImage also run on older distros.
          - os: ubuntu-22.04
            bundles: deb,appimage
            key: linux-x86_64
          - os: macos-latest
            bundles: app,dmg
            key: darwin-aarch64
          - os: windows-latest
            bundles: msi,nsis
            key: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libfuse2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: desktop
      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tauri.conf.json says $v, tag is ${GITHUB_REF_NAME}"; exit 1; }
      - run: npm run tauri build -- --bundles ${{ matrix.bundles }}
        working-directory: desktop
        env:
          # Baked in at compile time (option_env!), so the installers can sign in with Google.
          # Google treats a desktop client's secret as not confidential; it still stays out of the repo.
          EDGE_GOOGLE_CLIENT_ID: ${{ secrets.EDGE_GOOGLE_CLIENT_ID }}
          EDGE_GOOGLE_CLIENT_SECRET: ${{ secrets.EDGE_GOOGLE_CLIENT_SECRET }}
          # Signs the update packages; apps only install updates signed with this key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      - uses: actions/upload-artifact@v4
        with:
          name: edge-${{ matrix.key }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.sig
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app.tar.gz
            target/release/bundle/macos/*.app.tar.gz.sig
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Upload installers and latest.json to the sync server
        env:
          EDGE_PUBLISH_TOKEN: ${{ secrets.EDGE_PUBLISH_TOKEN }}
        run: python3 desktop/scripts/publish.py "${GITHUB_REF_NAME#v}" dist
